<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Beléptetés Állapota</title>
<style>
  :root {
    --bg: #14171A;
    --panel: #1D2227;
    --line: #2C333A;
    --text: #F1EEE7;
    --muted: #8E979F;
    --accent: #E3A857;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    margin: 0;
    padding: 40px 20px;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
  }
  h1 {
    font-size: 2rem;
    font-weight: 700;
    margin-bottom: 20px;
    letter-spacing: 0.5px;
  }
  .counter {
    font-size: 1.25rem;
    font-weight: 600;
    margin-bottom: 30px;
  }
  .counter span {
    font-weight: 700;
    color: var(--text);
  }
  table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
  }
  th {
    padding: 12px 16px;
    color: var(--text);
    font-weight: 700;
    font-size: 1.1rem;
    border-bottom: 1px solid var(--line);
  }
  td {
    padding: 16px;
    border-bottom: 1px solid var(--line);
    font-size: 1rem;
  }
  .code-col { font-weight: 600; text-transform: uppercase; }
  .name-col { font-weight: 700; font-size: 1.1rem; }
  .email-col { color: var(--muted); }
</style>
</head>
<body>

<div class="container">
  <h1>Beléptetés Állapota</h1>
  <div class="counter">Összesen: <span id="totalCount">0</span></div>

  <table>
    <thead>
      <tr>
        <th>Kód</th>
        <th>Név</th>
        <th>E-mail</th>
      </tr>
    </thead>
    <tbody id="participantTableBody">
      <!-- Dinamikusan töltődik be a Firestore-ból -->
    </tbody>
  </table>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAzXfTNTXJyf0DkdWejm6UQOv90dn67NnA",
    authDomain: "belepteto-app.firebaseapp.com",
    projectId: "belepteto-app",
    storageBucket: "belepteto-app.firebasestorage.app",
    messagingSenderId: "1017062734530",
    appId: "1:1017062734530:web:8267995d46729cc296995b"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const tableBody = document.getElementById("participantTableBody");
  const countElement = document.getElementById("totalCount");

  // A teljes participants gyűjtemény élő lekérdezése
  const participantsRef = collection(db, "participants");

  onSnapshot(participantsRef, (snapshot) => {
    tableBody.innerHTML = "";
    countElement.textContent = snapshot.size;

    snapshot.forEach((docSnap) => {
      const data = docSnap.data();
      const code = docSnap.id;
      const name = data.name || "Névtelen";
      const email = data.email || "—";

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="code-col">${code}</td>
        <td class="name-col">${name}</td>
        <td class="email-col">${email}</td>
      `;
      tableBody.appendChild(tr);
    });
  });
</script>

</body>
</html>
