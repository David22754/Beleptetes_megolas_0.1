<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beléptető Központ (Firebase)</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#14171A; --panel:#1D2126; --panel-alt:#23282E; --border:#333A42; --text:#F1EEE7; --text-dim:#9BA3AC; --accent:#E3A857; --accent-ink:#14171A; --good:#6FA287; --good-bg:rgba(111,162,135,.14); --bad:#C1666B; }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--text); font-family:'IBM Plex Mono', monospace; }
  h1,.display-title{ font-family:'Fraunces', serif; }
  #app{ max-width:900px; margin:0 auto; padding:20px; }
  header{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:20px; }
  nav.tabs{ display:flex; gap:2px; background:var(--panel-alt); border:1px solid var(--border); border-radius:10px; padding:3px; margin-bottom:20px; }
  nav.tabs button{ flex:1; border:none; background:transparent; color:var(--text-dim); padding:10px; border-radius:8px; cursor:pointer; font-family:inherit; }
  nav.tabs button.active{ background:var(--panel); color:var(--text); }
  .view{ display:none; } .view.active{ display:block; }
  .panel{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:16px; }
  label{ display:block; font-size:.72rem; color:var(--text-dim); margin-bottom:6px; }
  input[type=text], input[type=email]{ width:100%; background:var(--panel-alt); border:1px solid var(--border); color:var(--text); padding:10px; border-radius:8px; font-family:inherit; }
  .row{ display:flex; gap:10px; margin-top:8px; align-items:center; }
  .btn{ background:var(--accent); color:var(--accent-ink); border:none; border-radius:8px; padding:10px 16px; font-weight:600; cursor:pointer; }
  .btn.ghost{ background:transparent; color:var(--text); border:1px solid var(--border); }
  .btn.small{ padding:4px 8px; font-size:.75rem; }
  .btn.danger{ border-color:var(--bad); color:var(--bad); background:transparent; }

  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 24px;
    text-align: center;
    background: var(--panel-alt);
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .drop-zone.dragover {
    border-color: var(--accent);
    background: rgba(227, 168, 87, 0.08);
  }
  .drop-zone-text {
    color: var(--text-dim);
    font-size: 0.85rem;
    pointer-events: none;
  }
  .drop-zone-text b {
    color: var(--accent);
  }

  .prow{ display:flex; align-items:center; gap:12px; background:var(--panel-alt); border:1px solid var(--border); border-radius:10px; padding:10px; margin-top:10px; }
  .prow .select-box{ width:18px; height:18px; cursor:pointer; accent-color:var(--accent); }
  .prow .qr{ width:50px; height:50px; background:#fff; border-radius:6px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:transform 0.15s; padding:2px; }
  .prow .qr:hover{ transform:scale(1.08); }
  .prow .info{ flex:1; overflow:hidden; }
  .prow .info b{ display:block; text-overflow:ellipsis; overflow:hidden; white-space:nowrap; }
  .prow .info span{ display:block; color:var(--text-dim); font-size:.8rem; text-overflow:ellipsis; overflow:hidden; white-space:nowrap; }

  .bulk-bar{ display:flex; gap:10px; align-items:center; background:var(--panel-alt); border:1px solid var(--border); padding:10px 14px; border-radius:10px; margin-bottom:12px; }
  .bulk-bar label{ margin:0; cursor:pointer; display:flex; align-items:center; gap:6px; color:var(--text); font-size:.85rem; }

  table{ width:100%; border-collapse:collapse; margin-top:10px; }
  th,td{ padding:10px; text-align:left; border-bottom:1px solid var(--border); }

  .modal-backdrop{ position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.8); display:none; align-items:center; justify-content:center; z-index:999; backdrop-filter:blur(4px); }
  .modal-backdrop.active{ display:flex; }
  .modal-card{ background:var(--panel); border:1px solid var(--border); padding:24px; border-radius:16px; text-align:center; max-width:320px; width:90%; box-shadow:0 20px 40px rgba(0,0,0,0.5); }
  .modal-card h3{ margin:0 0 6px 0; font-family:'Fraunces', serif; font-size:1.3rem; word-break:break-word; }
  .modal-card p{ margin:0 0 16px 0; color:var(--text-dim); font-size:.8rem; }
  .modal-qr{ background:#fff; padding:16px; border-radius:12px; display:inline-block; margin-bottom:16px; }
  .empty-hint{ color:var(--text-dim); font-size:.82rem; padding:16px 0; text-align:center; }
</style>
</head>
<body>

<div id="app">
  <header>
    <h1>Beléptető Központ</h1>
    <div style="color:var(--text-dim); font-size:.8rem;" id="status-label">Firebase Csatlakozás...</div>
  </header>

  <nav class="tabs">
    <button data-view="admin" class="active">Résztvevők</button>
    <button data-view="display">Kivetítő</button>
    <button data-view="training">Továbbképzés</button>
  </nav>

  <section class="view active" id="view-admin">
    <div class="panel">
      <label>Egyéni résztvevő hozzáadása</label>
      <div class="row">
        <input type="text" id="new-name" placeholder="Név">
        <input type="email" id="new-email" placeholder="E-mail cím">
        <button class="btn" id="add-btn">Hozzáadás</button>
      </div>
    </div>

    <!-- Drag and Drop CSV Feltöltő Zóna -->
    <div class="panel">
      <label>CSV Tömeges Feltöltés</label>
      <div class="drop-zone" id="drop-zone">
        <div class="drop-zone-text" id="drop-zone-text">
          Húzd ide a CSV fájlt, vagy <b>Kattints a tallózáshoz</b>
        </div>
        <input type="file" id="csv-file" accept=".csv,text/csv" style="display:none;">
      </div>
      <div id="import-result" style="margin-top:8px; font-size:.78rem; color:var(--text-dim);"></div>
    </div>

    <input type="text" id="search" placeholder="Keresés..." style="margin-bottom:10px;">

    <div class="bulk-bar">
      <label><input type="checkbox" id="select-all" class="select-box"> Mind</label>
      <div style="flex:1;"></div>
      <button class="btn small danger" id="bulk-del-btn">Törlés</button>
    </div>

    <div id="plist"></div>
  </section>

  <section class="view" id="view-display">
    <div class="panel">
      <h2 class="display-title">Beléptetés Állapota</h2>
      <div style="margin-bottom:15px; font-size:1.1rem;">
        Összesen: <b id="stat-total">0</b>
      </div>
      <table>
        <thead><tr><th>Kód</th><th>Név</th><th>E-mail</th></tr></thead>
        <tbody id="display-tbody"></tbody>
      </table>
    </div>
  </section>

  <section class="view" id="view-training">
    <div class="panel">
      <h2 class="display-title">Szakmai Továbbképzés</h2>
      <div style="margin-bottom:15px; font-size:1.1rem;">
        Összesen: <b id="stat-cert" style="color:var(--accent);">0</b>
      </div>
      <table>
        <thead><tr><th>Kód</th><th>Név</th><th>E-mail</th></tr></thead>
        <tbody id="training-tbody"></tbody>
      </table>
      <div class="empty-hint" id="training-empty" style="display:none;">Nincsenek résztvevők a listában.</div>
    </div>
  </section>
</div>

<div class="modal-backdrop" id="qr-modal">
  <div class="modal-card">
    <h3 id="modal-name">Résztvevő Neve</h3>
    <p id="modal-code">KÓD123</p>
    <div class="modal-qr" id="modal-qr-box"></div>
    <div>
      <button class="btn ghost" id="modal-close-btn">Bezárás</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, doc, setDoc, onSnapshot, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAzXfTNTXJyf0DkdWejm6UQOv90dn67NnA",
    authDomain: "belepteto-app.firebaseapp.com",
    projectId: "belepteto-app",
    storageBucket: "belepteto-app.firebasestorage.app",
    messagingSenderId: "1017062734530",
    appId: "1:1017062734530:web:8267995d46729cc296995b"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  document.getElementById('status-label').textContent = "● Firebase Online";

  var participants = [];
  var selectedIds = new Set();

  var tabs = document.querySelectorAll('nav.tabs button');
  tabs.forEach(btn => {
    btn.addEventListener('click', () => {
      tabs.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById('view-' + btn.dataset.view).classList.add('active');
    });
  });

  onSnapshot(collection(db, "participants"), (snapshot) => {
    participants = [];
    snapshot.forEach((doc) => participants.push({ id: doc.id, ...doc.data() }));
    render();
  });

  document.getElementById('add-btn').addEventListener('click', async () => {
    const inputName = document.getElementById('new-name');
    const inputEmail = document.getElementById('new-email');
    const name = inputName.value.trim();
    const email = inputEmail.value.trim();
    if (!name) return;
    const code = Math.random().toString(36).substring(2, 8).toUpperCase();
    await setDoc(doc(db, "participants", code), {
      name: name,
      email: email
    });
    inputName.value = '';
    inputEmail.value = '';
  });

  // Drag and Drop CSV Feldolgozás
  const dropZone = document.getElementById('drop-zone');
  const csvFile = document.getElementById('csv-file');
  const importResult = document.getElementById('import-result');

  dropZone.addEventListener('click', () => csvFile.click());

  dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('dragover');
  });

  ['dragleave', 'dragend'].forEach(type => {
    dropZone.addEventListener(type, () => dropZone.classList.remove('dragover'));
  });

  dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length) {
      processCsvFile(e.dataTransfer.files[0]);
    }
  });

  csvFile.addEventListener('change', () => {
    if (csvFile.files.length) {
      processCsvFile(csvFile.files[0]);
    }
  });

  function processCsvFile(file) {
    const reader = new FileReader();
    reader.onload = async (e) => {
      const text = e.target.result;
      const lines = text.split(/\r\n|\n/).filter(line => line.trim() !== '');
      if (lines.length === 0) return;

      let added = 0;
      importResult.textContent = "Feltöltés folyamatban...";

      const delimiter = lines[0].includes(';') ? ';' : ',';
      const headerCols = lines[0].split(delimiter).map(c => c.trim().replace(/^["']|["']$/g, '').toUpperCase());
      let nameIndex = headerCols.findIndex(col => col === 'NAME' || col === 'NÉV' || col === 'NEV');
      let emailIndex = headerCols.findIndex(col => col === 'EMAIL' || col === 'E-MAIL');

      let startRow = 0;
      if (nameIndex !== -1) {
        startRow = 1;
      } else {
        nameIndex = 0;
        emailIndex = 1;
      }

      for (let i = startRow; i < lines.length; i++) {
        const cols = lines[i].split(delimiter);
        if (cols[nameIndex]) {
          let extractedName = cols[nameIndex].trim().replace(/^["']|["']$/g, '');
          let extractedEmail = cols[emailIndex] ? cols[emailIndex].trim().replace(/^["']|["']$/g, '') : '';
          
          if (extractedName.toUpperCase() === 'NAME' || extractedName.toUpperCase() === 'NÉV') continue;

          if (extractedName) {
            const code = Math.random().toString(36).substring(2, 8).toUpperCase();
            await setDoc(doc(db, "participants", code), {
              name: extractedName,
              email: extractedEmail
            });
            added++;
          }
        }
      }

      importResult.textContent = `Siker! ${added} résztvevő beimportálva.`;
      csvFile.value = '';
    };
    reader.readAsText(file);
  }

  // Tömeges kijelölés
  const selectAllCb = document.getElementById('select-all');
  selectAllCb.addEventListener('change', (e) => {
    const q = document.getElementById('search').value.toLowerCase();
    const filtered = participants.filter(p => p.name.toLowerCase().includes(q) || (p.email && p.email.toLowerCase().includes(q)) || p.id.toLowerCase().includes(q));
    
    if (e.target.checked) {
      filtered.forEach(p => selectedIds.add(p.id));
    } else {
      filtered.forEach(p => selectedIds.delete(p.id));
    }
    render();
  });

  document.getElementById('bulk-del-btn').onclick = async () => {
    if (!confirm(`Biztosan törölni szeretnéd a kijelölt ${selectedIds.size} résztvevőt?`)) return;
    for (let id of selectedIds) {
      await deleteDoc(doc(db, "participants", id));
    }
    selectedIds.clear();
  };

  const modal = document.getElementById('qr-modal');
  const modalQrBox = document.getElementById('modal-qr-box');
  
  function openQrModal(name, code) {
    document.getElementById('modal-name').textContent = name;
    document.getElementById('modal-code').textContent = "Azonosító: " + code;
    modalQrBox.innerHTML = '';
    new QRCode(modalQrBox, { text: code, width: 200, height: 200 });
    modal.classList.add('active');
  }

  document.getElementById('modal-close-btn').onclick = () => modal.classList.remove('active');
  modal.onclick = (e) => { if (e.target === modal) modal.classList.remove('active'); };

  function render() {
    const q = document.getElementById('search').value.toLowerCase();
    const listEl = document.getElementById('plist');
    listEl.innerHTML = '';

    const filtered = participants.filter(p => p.name.toLowerCase().includes(q) || (p.email && p.email.toLowerCase().includes(q)) || p.id.toLowerCase().includes(q));
    selectAllCb.checked = filtered.length > 0 && filtered.every(p => selectedIds.has(p.id));

    filtered.forEach(p => {
      const row = document.createElement('div');
      row.className = 'prow';
      const isChecked = selectedIds.has(p.id) ? 'checked' : '';

      row.innerHTML = `
        <input type="checkbox" class="select-box row-cb" ${isChecked}>
        <div class="qr" id="qr-${p.id}" title="Nagyítás"></div>
        <div class="info">
          <b title="${p.name}">${p.name}</b>
          <span>${p.email || '—'}</span>
          <small>${p.id}</small>
        </div>
        <button class="btn small danger del-btn">X</button>`;
      
      listEl.appendChild(row);
      
      const qrElement = document.getElementById(`qr-${p.id}`);
      try { new QRCode(qrElement, { text: p.id, width: 50, height: 50 }); } catch(e){}

      qrElement.onclick = () => openQrModal(p.name, p.id);

      row.querySelector('.row-cb').onchange = (e) => {
        if (e.target.checked) selectedIds.add(p.id);
        else selectedIds.delete(p.id);
        selectAllCb.checked = filtered.every(item => selectedIds.has(item.id));
      };

      row.querySelector('.del-btn').onclick = () => {
        deleteDoc(doc(db, "participants", p.id));
        selectedIds.delete(p.id);
      };
    });

    document.getElementById('stat-total').textContent = participants.length;
    const tbody = document.getElementById('display-tbody');
    tbody.innerHTML = participants.map(p => `
      <tr>
        <td><code>${p.id}</code></td>
        <td><b>${p.name}</b></td>
        <td>${p.email || '—'}</td>
      </tr>
    `).join('');

    // Továbbképzés füle
    document.getElementById('stat-cert').textContent = participants.length;
    const trainingTbody = document.getElementById('training-tbody');
    trainingTbody.innerHTML = participants.map(p => `
      <tr>
        <td><code>${p.id}</code></td>
        <td><b>${p.name}</b></td>
        <td>${p.email || '—'}</td>
      </tr>
    `).join('');
    document.getElementById('training-empty').style.display = participants.length ? 'none' : 'block';
  }

  document.getElementById('search').addEventListener('input', render);
</script>
</body>
</html>
